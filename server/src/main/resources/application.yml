spring:
  application:
    name: gullak
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  pattern:
    correlation: "[%X{requestId:-}] [%X{userId:-}] "
gullak:
  auth:
    jwt-secret: ${GULLAK_JWT_SECRET}
    otp-pepper: ${GULLAK_OTP_PEPPER}
    access-ttl: 15m
    refresh-ttl: 30d
    otp-ttl: 10m
